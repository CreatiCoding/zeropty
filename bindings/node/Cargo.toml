[package]
name = "zeropty-node"
version.workspace = true
rust-version.workspace = true
edition = "2024"
license = "MIT OR Apache-2.0"
description = "zeropty embedded in a Node process (N-API): the same calls as client/zeropty.mjs, with no server"
repository = "https://github.com/CreatiCoding/zeropty"

[lib]
name = "zeropty_node"
# rlib beside the module: cargo builds a package's lib before its integration tests, and one rustc run
# writes every crate type, so a plain `cargo test` also builds the module tests/plugin.rs loads (with the
# cdylib alone, cargo test built nothing and the test could only find an older `cargo build`'s module).
crate-type = ["cdylib", "rlib"]
# No unit tests in the module itself (its code is N-API glue, run by node): its test is
# tests/plugin.rs. Without this, `cargo test` listed an empty "unittests src/lib.rs" target.
test = false
doctest = false

[dependencies]
zeropty = { path = "../.." }
mimalloc = "0.1.52"
napi = { version = "3", default-features = false, features = ["napi6"] }
napi-derive = "3"
serde_json = "1"

[build-dependencies]
napi-build = "2"

[lints]
workspace = true
